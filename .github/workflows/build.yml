name: Build MailSync

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Mac (.dmg) ──────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install pyinstaller tqdm pillow

      - name: Installer create-dmg
        run: brew install create-dmg

      - name: Build
        run: python3 build.py

      - name: Déposer le DMG en artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailSync-Mac
          path: dist/*.dmg
          retention-days: 30

  # ── Windows (.exe installeur) ────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install pyinstaller tqdm pillow

      - name: Installer NSIS
        run: choco install nsis --yes

      - name: Build
        run: python build.py

      - name: Déposer l'EXE en artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailSync-Windows
          path: dist/*.exe
          retention-days: 30

  # ── Linux (.AppImage) ────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances système
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fuse libfuse2 xvfb

      - name: Installer les dépendances Python
        run: pip install pyinstaller tqdm pillow

      - name: Build
        run: xvfb-run python3 build.py

      - name: Déposer l'AppImage en artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailSync-Linux
          path: dist/*.AppImage
          retention-days: 30

  # ── Release (attend les trois builds) ────────────────────────────────────────
  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les artifacts Mac
        uses: actions/download-artifact@v4
        with:
          name: MailSync-Mac
          path: release/mac

      - name: Récupérer les artifacts Windows
        uses: actions/download-artifact@v4
        with:
          name: MailSync-Windows
          path: release/windows

      - name: Récupérer les artifacts Linux
        uses: actions/download-artifact@v4
        with:
          name: MailSync-Linux
          path: release/linux

      - name: Générer un tag de version
        id: tag
        run: echo "tag=v$(date +'%Y.%m.%d')-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "MailSync ${{ steps.tag.outputs.tag }}"
          body: |
            ## MailSync — Installeurs

            | Système | Fichier |
            |---------|---------|
            | Mac | MailSync.dmg |
            | Windows | MailSync Setup.exe |
            | Linux | MailSync.AppImage |

            ### Installation
            **Mac** : ouvrir le DMG et glisser dans Applications. Si Gatekeeper bloque, faire clic droit → Ouvrir.
            **Windows** : double-cliquer sur le Setup.exe. Si Defender bloque, cliquer "Informations complémentaires" → "Exécuter quand même".
            **Linux** : rendre le fichier exécutable (`chmod +x`) puis le lancer.
          files: |
            release/mac/*.dmg
            release/windows/*.exe
            release/linux/*.AppImage
          draft: false
          prerelease: false